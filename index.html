<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111827">
    
    <title>Kilo Mobile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@libsql/client/web": "https://esm.sh/@libsql/client/web?bundle"
        }
      }
    </script>

    <style>
        body { overscroll-behavior-y: contain; }
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col h-screen"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from "@libsql/client/web";
        const { useState, useEffect, useRef } = React;

        const TURSO_URL = "https://resale-pos-mrmulligan.aws-us-west-2.turso.io"; 
        const TURSO_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODkyNjk1MzksImlkIjoiMDFhMDhlMjktMDAwMS03YTFhLTgyMzQtYjFlNzkyN2FhNTE2Iiwia2lkIjoiLWpKYjA0NnRjWGxqM1AwVWhkaWFUYUlQenRJZFFONGRZb2RlLTl6dURtQSIsInJpZCI6ImI5NTdlMDg3LTA4NzctNDU5MC1iNmVkLWRhNWM3OGRmZGI0ZCJ9.Vq9xwjYdqVA0-tFVy5xr8oyBPS01qrOt4U3XRb31sVzpuDzFmC8FG8bsl8M_skwU13Xa41m1feIrVo7j_3l4Cw";
        
        const GEMINI_API_KEY = "AQ.Ab8RN6K-bHFXA1aE87v4bwIjkABCBInM2svxehf4HFkMZjYjvg";
        const TARGET_MODEL = "gemini-2.5-flash"; 

        let turso = null;
        try {
            if (TURSO_URL && TURSO_URL !== "YOUR_TURSO_DATABASE_URL") {
                turso = createClient({ url: TURSO_URL, authToken: TURSO_TOKEN });
            }
        } catch (e) {
            console.error("Failed to initialize Turso client:", e);
        }
        const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; 
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.4));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        function App() {
            const [dbConnected, setDbConnected] = useState(false);
            const [activeTab, setActiveTab] = useState('scanner');
            
            const [searchTitle, setSearchTitle] = useState('');
            const [cost, setCost] = useState('');
            const [salePrice, setSalePrice] = useState('');
            const [sku, setSku] = useState('');
            const [previewImage, setPreviewImage] = useState(null);

            const [isScanning, setIsScanning] = useState(false);
            const [isUploading, setIsUploading] = useState(false);
            
            const [inventory, setInventory] = useState([]);
            const [inventorySearch, setInventorySearch] = useState('');
            const [isFetchingInventory, setIsFetchingInventory] = useState(false);
            
            const [toast, setToast] = useState(null);
            const [selectedItem, setSelectedItem] = useState(null);

            const fileInputRef = useRef(null);
            const cameraInputRef = useRef(null);

            useEffect(() => {
                const initDB = async () => {
                    if (!turso) {
                        showToast("Turso keys missing.", "error");
                        return;
                    }

                    try {
                        await turso.execute(`
                            CREATE TABLE IF NOT EXISTS kilo_inventory (
                                id INTEGER PRIMARY KEY AUTOINCREMENT,
                                title TEXT,
                                cost REAL,
                                expectedPrice REAL,
                                sku TEXT,
                                profit REAL,
                                status TEXT,
                                timestamp INTEGER,
                                dateString TEXT
                            )
                        `);
                        setDbConnected(true);
                        fetchAllInventory(); 
                    } catch (error) {
                        console.error("Turso Connection Error:", error);
                        showToast("Database connection failed.", "error");
                    }
                };
                initDB();
            }, []);

            const fetchAllInventory = async () => {
                if (!turso) return;
                setIsFetchingInventory(true);
                try {
                    const result = await turso.execute("SELECT * FROM kilo_inventory ORDER BY id DESC");
                    setInventory(result.rows);
                } catch (error) {
                    console.error("Failed to fetch inventory:", error);
                    showToast("Failed to sync inventory.", "error");
                } finally {
                    setIsFetchingInventory(false);
                }
            };

            const showToast = (msg, type = "success") => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const scanImageWithGemini = async (base64Image) => {
                if (!GEMINI_API_KEY) {
                    showToast("API Key is missing!", "error");
                    return;
                }
                
                setIsScanning(true);
                try {
                    const base64Data = base64Image.split(',')[1];
                    const prompt = "You are an expert eBay reseller. Analyze this image. Return exactly two pieces of information separated by a single pipe symbol (|). First: A highly searchable eBay title (max 45 chars). Second: A realistic estimated resale value in USD (numbers only). Example output: Vintage Wilson Baseball Glove|45.00";

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000); 

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TARGET_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: controller.signal,
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                                ]
                            }]
                        })
                    });
                    
                    clearTimeout(timeoutId);
                    const data = await response.json();
                    
                    if (!response.ok) {
                        showToast(`API Error: ${data.error?.message || "Something went wrong"}`, "error");
                        return;
                    }
                    
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        const resultText = data.candidates[0].content.parts[0].text.trim();
                        const parts = resultText.split('|');
                        
                        if (parts.length >= 1) setSearchTitle(parts[0].trim());
                        if (parts.length >= 2) {
                            const value = parseFloat(parts[1].replace(/[^0-9.]/g, ''));
                            if (!isNaN(value)) setSalePrice(value);
                        }
                        showToast("Scan Complete!", "success");
                    } else {
                        showToast("Couldn't clearly identify the item.", "error");
                    }
                } catch (err) {
                    if (err.name === 'AbortError') {
                        showToast("Scanning timed out. Try a different angle.", "error");
                    } else {
                        showToast("Scanning failed: " + err.message, "error");
                    }
                } finally {
                    setIsScanning(false);
                }
            };
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setPreviewImage(URL.createObjectURL(file));
                    compressImage(file, scanImageWithGemini);
                }
                e.target.value = null; 
            };

            const handleUploadToKilo = async () => {
                if (!searchTitle || !cost || !salePrice) {
                    showToast("Title, Cost, and Est. Price are required!", "error");
                    return;
                }
                if (!dbConnected || !turso) {
                    showToast("Not connected to Turso database...", "error");
                    return;
                }

                setIsUploading(true);
                try {
                    const ts = Date.now();
                    const ds = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    const c = parseFloat(cost) || 0;
                    const s = parseFloat(salePrice) || 0;
                    const fee = s > 0 ? (s * 0.136) + 0.40 : 0;
                    const calculatedProfit = s - c - fee;

                    await turso.execute({
                        sql: "INSERT INTO kilo_inventory (title, cost, expectedPrice, sku, profit, status, timestamp, dateString) VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                        args: [
                            searchTitle,
                            c,
                            s,
                            sku || "",
                            calculatedProfit,
                            "Sourced in Field",
                            ts,
                            ds
                        ]
                    });
                    
                    showToast("Beamed to Kilo POS! 🚀", "success");
                    
                    setSearchTitle('');
                    setCost('');
                    setSalePrice('');
                    setSku('');
                    setPreviewImage(null);
                    
                    fetchAllInventory();
                    
                } catch (error) {
                    console.error("Upload Error:", error);
                    showToast("Failed to upload: " + error.message, "error");
                } finally {
                    setIsUploading(false);
                }
            };

            const handleSearchEbay = () => {
                if (!searchTitle) return;
                const url = `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(searchTitle)}&LH_Sold=1&LH_Complete=1`;
                window.open(url, '_blank');
            };

            const safeFloat = (val) => isNaN(parseFloat(val)) ? 0 : parseFloat(val);
            const numSale = safeFloat(salePrice);
            const numCost = safeFloat(cost);
            const ebayFee = numSale > 0 ? (numSale * 0.136) + 0.40 : 0; 
            const netProfit = numSale - numCost - ebayFee;
            const roi = numCost > 0 ? (netProfit / numCost) * 100 : 0;

            const filteredInventory = inventory.filter(item => 
                (item.title && item.title.toLowerCase().includes(inventorySearch.toLowerCase())) ||
                (item.sku && item.sku.toLowerCase().includes(inventorySearch.toLowerCase()))
            );

            return (
                <div className="flex flex-col h-full bg-gray-50 relative pb-safe">
                    
                    <header className="bg-gray-900 text-white pt-safe pb-4 px-5 shadow-md flex items-center justify-between sticky top-0 z-30 pt-4">
                        <div className="flex items-center gap-2">
                            <span className="text-2xl">📱</span>
                            <h1 className="font-black text-xl tracking-tight">Kilo Field App</h1>
                        </div>
                        <div className="flex items-center gap-2 text-xs font-bold">
                            <div className={`w-3 h-3 rounded-full ${dbConnected ? 'bg-green-500 animate-pulse' : 'bg-red-500'}`}></div>
                            {dbConnected ? 'Turso DB Linked' : 'Connecting DB'}
                        </div>
                    </header>

                    {toast && (
                        <div className="fixed top-20 left-0 right-0 flex justify-center z-50 px-4 animate-bounce">
                            <div className={`${toast.type === 'error' ? 'bg-red-600' : 'bg-green-600'} text-white px-6 py-3 rounded-full shadow-2xl font-bold flex items-center gap-2 text-sm`}>
                                {toast.type === 'error' ? '⚠️' : '✅'} {toast.msg}
                            </div>
                        </div>
                    )}

                    {(isScanning || isUploading) && (
                        <div className="absolute inset-0 bg-white/80 z-40 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-gray-900 text-white px-6 py-4 rounded-2xl font-bold shadow-2xl flex flex-col items-center gap-3">
                                <span className="text-4xl animate-spin">⚙️</span>
                                {isScanning ? 'AI is analyzing image...' : 'Pushing to Database...'}
                            </div>
                        </div>
                    )}

                    {selectedItem && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setSelectedItem(null)}>
                            <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl fade-in" onClick={e => e.stopPropagation()}>
                                <div className="p-5 border-b border-gray-100 flex justify-between items-start bg-gray-50">
                                    <h3 className="font-black text-lg text-gray-900 leading-tight pr-4">{selectedItem.title}</h3>
                                    <button onClick={() => setSelectedItem(null)} className="bg-gray-200 text-gray-600 rounded-full p-1.5 shadow-sm active:scale-95">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div className="flex justify-between items-center text-sm">
                                        <span className="font-bold text-gray-500">Status</span>
                                        <span className="bg-blue-100 text-blue-700 font-black px-3 py-1 rounded-full text-xs uppercase tracking-wider">{selectedItem.status || 'Active'}</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 pt-2">
                                        <div className="bg-gray-50 p-3 rounded-2xl border border-gray-100 text-center">
                                            <span className="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Cost</span>
                                            <span className="font-black text-red-500 text-lg">${parseFloat(selectedItem.cost).toFixed(2)}</span>
                                        </div>
                                        <div className="bg-gray-50 p-3 rounded-2xl border border-gray-100 text-center">
                                            <span className="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Est. Value</span>
                                            <span className="font-black text-gray-900 text-lg">${parseFloat(selectedItem.expectedPrice).toFixed(2)}</span>
                                        </div>
                                    </div>
                                    <div className="bg-gray-900 text-white p-4 rounded-2xl shadow-inner flex justify-between items-center">
                                        <span className="font-bold uppercase tracking-wider text-xs text-gray-300">Est. Profit</span>
                                        <span className="font-black text-green-400 text-2xl">${parseFloat(selectedItem.profit).toFixed(2)}</span>
                                    </div>
                                    {selectedItem.sku && (
                                        <div className="pt-2 text-center">
                                            <span className="bg-gray-100 text-gray-600 font-bold px-3 py-1.5 rounded-lg text-xs tracking-widest border border-gray-200">SKU: {selectedItem.sku}</span>
                                        </div>
                                    )}
                                    <div className="text-center pt-2 text-xs text-gray-400 font-bold">
                                        Added: {selectedItem.dateString || 'Unknown Date'}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    <main className="flex-1 overflow-y-auto p-4 pb-24">
                        
                        {activeTab === 'scanner' && (
                            <div className="max-w-lg mx-auto space-y-5 fade-in">
                                
                                <div className="bg-white p-5 rounded-3xl shadow-sm border border-gray-200">
                                    <h2 className="text-lg font-black text-gray-900 mb-4">Item Identification</h2>
                                    
                                    <div className="flex gap-2 mb-3">
                                        <div className="relative flex-1">
                                            <input 
                                                type="text" 
                                                value={searchTitle}
                                                onChange={e => setSearchTitle(e.target.value)}
                                                className="w-full pl-4 pr-12 py-3.5 bg-gray-100 border-2 border-transparent rounded-2xl focus:bg-white focus:border-indigo-500 outline-none transition-all font-bold text-gray-800" 
                                                placeholder="Title or Keywords..." 
                                            />
                                            {previewImage && (
                                                <div className="absolute right-2 top-2 h-10 w-10 rounded-lg overflow-hidden border border-gray-300 shadow-sm">
                                                    <img src={previewImage} className="w-full h-full object-cover" />
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button onClick={handleSearchEbay} className="flex-1 bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-md active:scale-95 transition-transform flex justify-center items-center gap-2">
                                            🔍 Check eBay
                                        </button>
                                        
                                        <input type="file" accept="image/*" ref={fileInputRef} className="hidden" onChange={handleFileChange} />
                                        <input type="file" accept="image/*" capture="environment" ref={cameraInputRef} className="hidden" onChange={handleFileChange} />
                                        
                                        <button type="button" onClick={() => cameraInputRef.current.click()} className="bg-gray-900 text-white w-12 rounded-2xl font-bold shadow-md active:scale-95 transition-transform flex justify-center items-center text-xl">
                                            📸
                                        </button>
                                        <button type="button" onClick={() => fileInputRef.current.click()} className="bg-gray-100 text-gray-700 w-12 border-2 border-gray-200 rounded-2xl font-bold shadow-sm active:scale-95 transition-transform flex justify-center items-center text-xl">
                                            🖼️
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white p-5 rounded-3xl shadow-sm border border-gray-200 space-y-4">
                                    <h3 className="font-black text-gray-900 flex justify-between items-center">
                                        Profit Calculator
                                        <span className="text-xs font-bold bg-green-100 text-green-800 px-2 py-1 rounded-lg border border-green-200">
                                            ROI: {roi > 0 ? roi.toFixed(0) : '0'}%
                                        </span>
                                    </h3>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Buy Cost ($)</label>
                                            <input type="number" step="0.01" value={cost} onChange={e => setCost(e.target.value)} className="w-full bg-transparent font-black text-xl text-red-600 outline-none" placeholder="0.00" />
                                        </div>
                                        <div className="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Est. Sale ($)</label>
                                            <input type="number" step="0.01" value={salePrice} onChange={e => setSalePrice(e.target.value)} className="w-full bg-transparent font-black text-xl text-green-600 outline-none" placeholder="0.00" />
                                        </div>
                                        <div className="col-span-2 bg-gray-50 p-3 rounded-2xl border border-gray-100">
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Store SKU (Optional)</label>
                                            <input type="text" value={sku} onChange={e => setSku(e.target.value)} className="w-full bg-transparent font-bold text-gray-700 outline-none" placeholder="e.g. Bin 4, Blue Tag" />
                                        </div>
                                    </div>

                                    <div className="pt-2">
                                        <div className="flex justify-between items-center text-sm mb-2 px-1">
                                            <span className="text-gray-500 font-medium">eBay Fees (13.6%):</span>
                                            <span className="font-bold text-red-500">-${ebayFee.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between items-center p-4 bg-gray-900 text-white rounded-2xl shadow-inner">
                                            <span className="font-bold text-gray-300 uppercase tracking-wider text-xs">Net Profit</span>
                                            <span className={`text-3xl font-black ${netProfit > 0 ? 'text-green-400' : 'text-white'}`}>
                                                ${netProfit.toFixed(2)}
                                            </span>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleUploadToKilo}
                                        className="w-full mt-2 bg-blue-500 hover:bg-blue-600 active:scale-95 text-white font-black text-lg py-4 rounded-2xl transition-all shadow-[0_4px_14px_0_rgba(59,130,246,0.39)] flex justify-center items-center gap-2">
                                        ☁️ Send to Kilo POS
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'inventory' && (
                            <div className="max-w-lg mx-auto space-y-4 fade-in">
                                <div className="flex justify-between items-end mb-2">
                                    <h2 className="text-2xl font-black text-gray-900">Live Inventory</h2>
                                    <button 
                                        onClick={fetchAllInventory}
                                        className="text-blue-600 text-sm font-bold bg-blue-50 px-3 py-1 rounded-lg active:scale-95 transition-transform flex items-center gap-1"
                                    >
                                        <span className={isFetchingInventory ? "animate-spin" : ""}>🔄</span> Sync
                                    </button>
                                </div>
                                
                                <div className="relative mb-4">
                                    <input 
                                        type="text" 
                                        value={inventorySearch}
                                        onChange={e => setInventorySearch(e.target.value)}
                                        placeholder="Search by Title or SKU..." 
                                        className="w-full pl-4 pr-10 py-3 bg-white border border-gray-200 rounded-2xl focus:border-blue-500 outline-none shadow-sm font-medium"
                                    />
                                    <span className="absolute right-3 top-3 text-gray-400">🔍</span>
                                </div>

                                {isFetchingInventory && inventory.length === 0 ? (
                                    <div className="text-center py-10 text-gray-500 font-bold animate-pulse">
                                        Loading warehouse data...
                                    </div>
                                ) : filteredInventory.length === 0 ? (
                                    <div className="bg-white rounded-3xl border-2 border-dashed border-gray-200 p-10 text-center flex flex-col items-center">
                                        <span className="text-5xl mb-3">📦</span>
                                        <p className="text-gray-500 font-bold">No items found.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3 pb-6">
                                        {filteredInventory.map((item) => (
                                            <div 
                                                key={item.id} 
                                                onClick={() => setSelectedItem(item)}
                                                className="bg-white p-4 rounded-3xl shadow-sm border border-gray-200 flex gap-4 items-center active:scale-[0.98] transition-transform cursor-pointer"
                                            >
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex justify-between items-start gap-2">
                                                        <h4 className="font-bold text-gray-900 leading-tight truncate">{item.title}</h4>
                                                        <span className="bg-gray-100 text-gray-600 text-[10px] font-black px-2 py-0.5 rounded-full whitespace-nowrap border border-gray-200">
                                                            ID: {item.id}
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center gap-2 mt-1.5 text-xs font-bold">
                                                        <span className="text-red-500 bg-red-50 px-2 py-0.5 rounded-md">Cost: ${parseFloat(item.cost).toFixed(2)}</span>
                                                        <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">Value: ${parseFloat(item.expectedPrice).toFixed(2)}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-gray-200 pb-safe z-40">
                        <div className="flex justify-around max-w-md mx-auto p-2">
                            <button 
                                onClick={() => setActiveTab('scanner')}
                                className={`flex-1 flex flex-col items-center justify-center p-3 rounded-2xl transition-all ${activeTab === 'scanner' ? 'text-blue-600 bg-blue-50' : 'text-gray-400 active:bg-gray-100'}`}
                            >
                                <span className={`text-2xl mb-1 ${activeTab === 'scanner' ? 'scale-110 drop-shadow-md' : 'grayscale opacity-50'}`}>📸</span>
                                <span className="text-[11px] font-black tracking-wide">SCANNER</span>
                            </button>
                            <button 
                                onClick={() => setActiveTab('inventory')}
                                className={`flex-1 flex flex-col items-center justify-center p-3 rounded-2xl transition-all ${activeTab === 'inventory' ? 'text-blue-600 bg-blue-50' : 'text-gray-400 active:bg-gray-100'}`}
                            >
                                <span className={`text-2xl mb-1 ${activeTab === 'inventory' ? 'scale-110 drop-shadow-md' : 'grayscale opacity-50'}`}>📦</span>
                                <span className="text-[11px] font-black tracking-wide">INVENTORY</span>
                            </button>
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
